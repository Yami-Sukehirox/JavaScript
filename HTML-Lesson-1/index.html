<!DOCTYPE html>
<html lang="en">
    <head>
    <title>Website.Lian</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keyworfs" content="HTML">
    <meta name="description" content="This is my portfolio website.">
    <link rel="stylesheet" href="style.css"/>   
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css" rel="stylesheet">
    </head>
    <body>

        
      <div class="login-container">
      <h1 class="calculator-title">
      <i class="bx bx-calculator"></i>ReneCalCu</h1>
     
      <div class="wrapper">
        <div class="circle c1"></div>
        <div class="circle c2"></div>
        
        <div class="calculator">
          <div class="display" id="display">
            0
          </div>
        

        <div class="buttons">
          <button class="clear" onclick="clearDisplay()">C</button>
          <button class="backspace" onclick="deleteChar('>')">Clear</button>
          <button class="operator" onclick="add('%')">%</button>
          <button class="operator" onclick="add('/')">/</button>
        
<button onclick="add('7')">7</button>
<button onclick="add('8')">8</button>
<button onclick="add('9')">9</button>
<button class="operator" onclick="add('X')">x</button>

<button onclick="add('4')">4</button>
<button onclick="add('5')">5</button>
<button onclick="add('6')">6</button>
<button class="operator" onclick="add('-')">-</button>

<button onclick="add('1')">1</button>
<button onclick="add('2')">2</button>
<button onclick="add('3')">3</button>
<button class="operator" onclick="add('+')">+</button>

<button onclick="add('0')">0</button>
<button onclick="add('.')">.</button>
<button class="equal" onclick="calculate()">=</button>

        </div>
      </div>
    </div>
    </div>
  </div>
     <script src="index.js"></script>
    </body>
</html>
